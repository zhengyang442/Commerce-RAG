name: Bug report
description: 报告可复现的问题；不要粘贴密钥或个人数据
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认问题不包含 API Key、访问令牌、私有域名或可利用的安全细节。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      description: 请提供命令、输入和预期结果；删除所有密钥。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.4 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、uv、SQLite 版本。
    validations:
      required: true
